const FRQS = {
u1: { title:"FRQ Practice — element X from evidence", intro:`A pure element X has the following properties: its mass spectrum shows peaks at 28 (92.2%), 29 (4.7%) and 30 (3.1%); its photoelectron spectrum shows five peaks with relative heights 2 : 2 : 6 : 2 : 2.`, parts:[
 {q:"(a) Calculate the average atomic mass of X and identify the element.", pts:2, ans:"28(0.922) + 29(0.047) + 30(0.031) ≈ 28.1 → silicon. [1 pt calculation, 1 pt identification]"},
 {q:"(b) Write the complete ground-state electron configuration of X and explain how the PES peak heights support it.", pts:2, ans:"1s²2s²2p⁶3s²3p². Peak heights 2:2:6:2:2 match the electron counts of each subshell. [1 pt configuration, 1 pt height↔count link]"},
 {q:"(c) A student claims the 1s peak appears at the LOWEST binding energy because 1s fills first. Correct the claim.", pts:2, ans:"Wrong: 1s electrons are closest to the nucleus, feel the greatest Coulombic attraction, and therefore appear at the HIGHEST binding energy. [1 pt correct position, 1 pt Coulombic reasoning]"},
 {q:"(d) Predict whether the first ionization energy of X is larger or smaller than that of phosphorus, and justify.", pts:1, ans:"Smaller. P has one more proton with electrons in the same shell (greater Z_eff), so P holds its valence electrons more tightly. [1 pt prediction + justification together]"},
]},
u2: { title:"FRQ Practice — structure of two carbon oxides", intro:`Consider carbon dioxide (CO₂) and the carbonate ion (CO₃²⁻).`, parts:[
 {q:"(a) Draw the Lewis structure of each species (describe them in words if practicing mentally): bonds and lone pairs.", pts:2, ans:"CO₂: O=C=O, each O with 2 lone pairs. CO₃²⁻: one C=O and two C–O⁻ (three resonance forms), each singly-bonded O carrying 3 lone pairs. [1 pt each]"},
 {q:"(b) Predict the molecular geometry and bond angle of each.", pts:2, ans:"CO₂: linear, 180° (2 domains). CO₃²⁻: trigonal planar, 120° (3 domains, no lone pairs on C). [1 pt each]"},
 {q:"(c) Experimentally, all three C–O bonds in carbonate are identical, with a length between typical C–O and C=O. Explain.", pts:2, ans:"The true structure is a resonance hybrid: the double-bond character is delocalized equally over three positions → bond order 4/3 for each. [1 pt resonance/delocalization, 1 pt equal intermediate bonds]"},
 {q:"(d) Is CO₂ polar? Justify in terms of bond dipoles.", pts:1, ans:"Nonpolar: the two polar C=O bond dipoles are equal and opposite in the linear geometry, so they cancel. [1 pt]"},
]},
u3: { title:"FRQ Practice — three liquids, one argument", intro:`Consider three substances of similar molar mass: butane (C₄H₁₀, M=58), acetone (CH₃COCH₃, M=58), and 1-propanol (C₃H₇OH, M=60). Their boiling points are −1°C, 56°C, and 97°C (in some order).`, parts:[
 {q:"(a) Assign each boiling point to the correct substance.", pts:1, ans:"Butane −1°C, acetone 56°C, 1-propanol 97°C. [1 pt all three]"},
 {q:"(b) Justify the assignment by identifying the strongest intermolecular force in EACH substance.", pts:3, ans:"Butane: nonpolar → London dispersion only. Acetone: polar C=O → dipole–dipole (+LDF), but no H on O/N → no H-bonding. 1-propanol: O–H group → hydrogen bonding, the strongest of the three. Similar molar mass makes LDF comparable, so the extra forces decide. [1 pt per substance]"},
 {q:"(c) Which of the three has the highest vapor pressure at 25°C? Explain.", pts:1, ans:"Butane — weakest IMFs → molecules escape to the gas phase most easily → highest vapor pressure. [1 pt, must connect weak IMF → high VP]"},
 {q:"(d) When 1-propanol boils, which bonds/forces are overcome? Which are NOT broken?", pts:2, ans:"Hydrogen bonds (and other IMFs) BETWEEN molecules are overcome; covalent O–H and C–C/C–H bonds WITHIN molecules are not broken. [1 pt each side]"},
]},
u4: { title:"FRQ Practice — identifying a white solid", intro:`A student has a white solid known to be either Ba(NO₃)₂ or BaCl₂. Dissolving 0.50 g in water and adding excess AgNO₃(aq) produces 0.689 g of white precipitate.`, parts:[
 {q:"(a) Write the net ionic equation for the reaction that forms the precipitate, and identify the solid.", pts:2, ans:"Ag⁺(aq) + Cl⁻(aq) → AgCl(s). A precipitate forms at all → the solid contains chloride → BaCl₂. (With Ba(NO₃)₂, no reaction: all nitrates and AgNO₃ products stay soluble.) [1 pt equation, 1 pt identification]"},
 {q:"(b) Show with a calculation that the precipitate mass is consistent with the identification. (BaCl₂ M = 208.2; AgCl M = 143.3)", pts:3, ans:"mol BaCl₂ = 0.50/208.2 = 2.40×10⁻³ → mol Cl⁻ = 4.80×10⁻³ → mass AgCl = 4.80×10⁻³ × 143.3 = 0.688 g ≈ 0.689 g ✓. [1 pt mol conversion, 1 pt 1:2 ratio, 1 pt final comparison]"},
 {q:"(c) Name the spectator ions during the precipitation.", pts:1, ans:"Ba²⁺ and NO₃⁻. [1 pt]"},
 {q:"(d) The student forgot to dry the precipitate fully before weighing. How does this affect the calculated moles of chloride? Justify.", pts:1, ans:"Wet precipitate weighs MORE → calculated mol AgCl (and thus Cl⁻) comes out too HIGH. [1 pt with direction + reason]"},
]},
u5: { title:"FRQ Practice — decomposition kinetics", intro:`The decomposition 2N₂O₅(g) → 4NO₂(g) + O₂(g) is studied. A plot of ln[N₂O₅] versus time gives a straight line with slope −6.9×10⁻³ s⁻¹.`, parts:[
 {q:"(a) What is the order of the reaction in N₂O₅? Justify from the plot.", pts:1, ans:"First order — only for first-order reactions is ln[A] vs t linear. [1 pt]"},
 {q:"(b) Write the rate law and give the value of k with units.", pts:2, ans:"rate = k[N₂O₅]; k = 6.9×10⁻³ s⁻¹ (magnitude of the slope). [1 pt rate law, 1 pt k + units]"},
 {q:"(c) Calculate the half-life. What fraction of the original N₂O₅ remains after 300 s?", pts:2, ans:"t½ = 0.693/6.9×10⁻³ ≈ 100 s. 300 s = 3 half-lives → (½)³ = 1/8 ≈ 12.5% remains. [1 pt t½, 1 pt fraction]"},
 {q:"(d) A proposed single-step mechanism is the collision of two N₂O₅ molecules. Is this consistent with the rate law? Explain.", pts:2, ans:"No — an elementary bimolecular step 2N₂O₅ → products would give rate = k[N₂O₅]², second order. The observed first order means the mechanism must involve multiple steps with a unimolecular slow step. [1 pt predicted order, 1 pt conclusion]"},
]},
u6: { title:"FRQ Practice — hand warmer chemistry", intro:`A hand warmer works by dissolving CaCl₂(s) in water. A student dissolves 5.55 g of CaCl₂ (M = 111.0) in 100.0 g of water in a coffee-cup calorimeter; the temperature rises from 21.0°C to 30.5°C. (c of solution = 4.18 J/g·°C; assume the solution's mass is 105.6 g.)`, parts:[
 {q:"(a) Calculate the heat absorbed by the solution.", pts:1, ans:"q = 105.6 × 4.18 × 9.5 ≈ 4.19×10³ J ≈ 4.2 kJ. [1 pt]"},
 {q:"(b) Calculate ΔH of dissolution in kJ/mol. Include the sign.", pts:2, ans:"mol CaCl₂ = 5.55/111.0 = 0.0500 mol. ΔH = −4.19 kJ/0.0500 mol ≈ −84 kJ/mol (negative: solution warmed, so the process released heat). [1 pt magnitude, 1 pt sign+logic]"},
 {q:"(c) Is the dissolution exothermic or endothermic? Explain in terms of the energy of breaking and forming interactions.", pts:2, ans:"Exothermic. Energy released forming ion–dipole attractions (hydration) exceeds energy required to break the ionic lattice and separate some water–water hydrogen bonds. [1 pt classification, 1 pt break-vs-form comparison]"},
 {q:"(d) The calorimeter actually absorbs some heat itself. Does ignoring this make the calculated |ΔH| too large or too small? Justify.", pts:1, ans:"Too small — some released heat went into the cup, not the solution, so q_solution underestimates the true heat released. [1 pt direction + reason]"},
]},
u7: { title:"FRQ Practice — an equilibrium under stress", intro:`Consider the endothermic equilibrium: CaCO₃(s) ⇌ CaO(s) + CO₂(g), with Kp = P(CO₂). At 800°C, Kp = 0.22 atm.`, parts:[
 {q:"(a) Why do CaCO₃ and CaO not appear in the equilibrium expression?", pts:1, ans:"They are pure solids — their activity is 1 and their 'concentration' does not change. [1 pt]"},
 {q:"(b) A rigid 10.0-L vessel at 800°C contains excess CaCO₃(s) and CO₂ at 0.10 atm. Which direction does the reaction proceed? Justify with Q.", pts:2, ans:"Q = P(CO₂) = 0.10 < Kp = 0.22 → proceeds FORWARD (more CaCO₃ decomposes) until P(CO₂) = 0.22 atm. [1 pt Q comparison, 1 pt direction]"},
 {q:"(c) The temperature is increased. What happens to Kp? Justify.", pts:2, ans:"Kp increases — the reaction is endothermic (heat acts as a reactant), so higher T favors products. Temperature is the only stress that changes K. [1 pt direction, 1 pt endothermic reasoning]"},
 {q:"(d) Extra CaCO₃(s) is added at constant T. What happens to P(CO₂)? Explain.", pts:1, ans:"Nothing — adding pure solid does not change any activity in the expression; P(CO₂) stays at Kp. [1 pt]"},
 {q:"(e) The vessel's volume is halved at constant T. Describe what happens immediately and at the new equilibrium.", pts:2, ans:"Immediately P(CO₂) doubles to 0.44 atm → Q > Kp → reverse reaction (CO₂ + CaO → CaCO₃) consumes gas until P(CO₂) returns to 0.22 atm. Same final pressure, less gas. [1 pt immediate, 1 pt return to Kp]"},
]},
u8: { title:"FRQ Practice — analyzing a weak acid", intro:`A student titrates 25.0 mL of a monoprotic weak acid HA with 0.100 M NaOH. The equivalence point comes at 30.0 mL of base; when 15.0 mL of base has been added, the pH is 4.80.`, parts:[
 {q:"(a) Calculate the initial concentration of HA.", pts:2, ans:"mol HA = mol base at equivalence = 0.0300 L × 0.100 = 3.00×10⁻³ mol → [HA] = 3.00×10⁻³/0.0250 = 0.120 M. [1 pt mole equality, 1 pt concentration]"},
 {q:"(b) Determine the pKa (and Ka) of HA. Justify your reasoning.", pts:2, ans:"15.0 mL is exactly HALF of 30.0 mL → half-equivalence → [HA] = [A⁻] → pH = pKa = 4.80 → Ka = 10⁻⁴·⁸ ≈ 1.6×10⁻⁵. [1 pt half-equivalence recognition, 1 pt Ka]"},
 {q:"(c) Will the pH at the equivalence point be equal to, greater than, or less than 7? Explain.", pts:2, ans:"Greater than 7: at equivalence only A⁻ remains, a weak base that accepts protons from water, producing OH⁻. [1 pt prediction, 1 pt conjugate-base reasoning]"},
 {q:"(d) Between phenolphthalein (color change pH ≈ 8.2–10) and methyl red (pH ≈ 4.4–6.2), which indicator should be used? Why?", pts:1, ans:"Phenolphthalein — its color-change range brackets the basic equivalence pH (~8.7). Methyl red would change far too early. [1 pt choice + reason]"},
 {q:"(e) Describe how to prepare a buffer of pH 4.80 using HA and NaOH.", pts:1, ans:"Half-neutralize: add NaOH equal to half the moles of HA (e.g., 15.0 mL of 0.100 M NaOH per 25.0 mL of 0.120 M HA) → equal HA and A⁻ → pH = pKa = 4.80. [1 pt]"},
]},
u9: { title:"FRQ Practice — a zinc–silver cell", intro:`A galvanic cell uses Zn/Zn²⁺ (E° = −0.76 V) and Ag/Ag⁺ (E° = +0.80 V) half-cells, connected by a salt bridge containing KNO₃.`, parts:[
 {q:"(a) Identify the anode and cathode, and write the overall balanced equation.", pts:2, ans:"Anode: Zn (oxidation, lower E°); cathode: Ag. Overall: Zn + 2Ag⁺ → Zn²⁺ + 2Ag. [1 pt electrodes, 1 pt balanced equation]"},
 {q:"(b) Calculate E°cell and ΔG° (in kJ). Is the reaction thermodynamically favorable?", pts:3, ans:"E°cell = 0.80 − (−0.76) = 1.56 V (do NOT double silver's E°). n = 2 → ΔG° = −nFE° = −2(96 485)(1.56) ≈ −301 kJ. Negative → favorable. [1 pt E°, 1 pt ΔG° with n=2, 1 pt conclusion]"},
 {q:"(c) In which direction do the NO₃⁻ ions in the salt bridge migrate? Why?", pts:2, ans:"Toward the ANODE (Zn) half-cell — positive Zn²⁺ ions accumulate there and anions flow in to neutralize the buildup, keeping the circuit closed. [1 pt direction, 1 pt neutrality reasoning]"},
 {q:"(d) As the cell operates, [Ag⁺] decreases. What happens to the cell voltage over time? Explain using Q.", pts:2, ans:"Voltage decreases: consuming Ag⁺ (reactant) and producing Zn²⁺ (product) raises Q toward K, driving E from E° toward 0 — the cell dies at equilibrium (E = 0, Q = K). [1 pt direction, 1 pt Q reasoning]"},
]},
};

{t:"0.1 What chemistry studies — matter, atoms, elements", h:`
<p>Everything you can touch is <b>matter</b>, and all matter is built from about 100 kinds of tiny particles called <b>atoms</b>. A substance made of only one kind of atom is an <b>element</b> (iron, oxygen, gold). When atoms of different elements link together in fixed ratios, you get a <b>compound</b> — water (H<sub>2</sub>O) is hydrogen and oxygen locked together 2-to-1, and it behaves nothing like either parent element.</p>
<p>An atom itself has structure: a tiny, heavy, positively charged <b>nucleus</b> (protons + neutrons) with light, negative <b>electrons</b> moving around it in layers called <b>shells</b>. The number of protons — the <b>atomic number</b> — is the element's identity card: 6 protons is always carbon, 8 is always oxygen.</p>
${DIAG2.atom}
<p>A <b>mixture</b> is different from a compound: in a mixture (sea water, air, salad) the ingredients keep their own identities and can be separated physically; in a compound they're chemically bound and separating them requires a chemical reaction.</p>
<div class="ls-ex"><b>Quick sorting drill.</b> Oxygen gas (O<sub>2</sub>) → element. Table salt (NaCl) → compound. Orange juice → mixture. Diamond (pure C) → element. Rust (Fe<sub>2</sub>O<sub>3</sub>) → compound.</div>`},
{t:"0.2 Reading the periodic table", h:`
<p>The periodic table is not a poster to memorize — it's a <b>data sheet</b> you'll use in every single problem (and it's given to you in the exam). For each element box, you need two numbers: the <b>atomic number</b> (top, whole number — the proton count) and the <b>atomic mass</b> (bottom, decimal — the average mass in grams per mole).</p>
<ul>
<li><b>Rows are periods:</b> each new row starts a new electron shell.</li>
<li><b>Columns are groups:</b> elements in a column have the same number of outer electrons — which is why they behave alike. Group 1 (Li, Na, K) are all soft, violently reactive metals; Group 17 (F, Cl, Br, I) are all aggressive nonmetals; Group 18 (He, Ne, Ar) barely react at all.</li>
<li><b>The staircase line</b> on the right separates <b>metals</b> (left — shiny, conduct electricity, lose electrons) from <b>nonmetals</b> (right — gain or share electrons).</li></ul>
<div class="ls-ex"><b>Try it.</b> Chlorine: atomic number 17 → 17 protons, 17 electrons (when neutral); mass 35.45 → one mole of Cl atoms weighs 35.45 g; Group 17 → 7 outer electrons → hungry for one more.</div>`},
{t:"0.3 Chemical formulas — the language", h:`
<p>A formula is a recipe. <b>Subscripts</b> count atoms: H<sub>2</sub>O = 2 hydrogens + 1 oxygen. <b>Parentheses</b> group units: Ca(NO<sub>3</sub>)<sub>2</sub> = 1 calcium + 2 nitrate groups = 1 Ca, 2 N, 6 O. A leading <b>coefficient</b> counts whole molecules: 3H<sub>2</sub>O = 3 water molecules = 6 H and 3 O in total.</p>
<p>Naming, the two patterns you'll meet constantly:</p>
<ul>
<li><b>Ionic compounds</b> (metal + nonmetal): name the metal, then the nonmetal with <i>-ide</i>: NaCl = sodium chloride; MgO = magnesium oxide. If a polyatomic ion is involved, use its name: NaNO<sub>3</sub> = sodium nitrate. Transition metals get a Roman numeral for their charge: FeCl<sub>3</sub> = iron(III) chloride.</li>
<li><b>Molecular compounds</b> (nonmetal + nonmetal): count with prefixes: CO<sub>2</sub> = carbon <i>di</i>oxide, N<sub>2</sub>O<sub>4</sub> = <i>di</i>nitrogen <i>tetr</i>oxide.</li></ul>
<div class="ls-trap"><b>Trap.</b> Ionic formulas are RATIOS (NaCl is a lattice, not a molecule); molecular formulas are actual molecules. This distinction matters all the way to Unit 3.</div>`},
{t:"0.4 Chemical equations & balancing", h:`
<p>A chemical equation is bookkeeping: <b>reactants → products</b>, with state labels (s) solid, (l) liquid, (g) gas, (aq) dissolved in water. Atoms are never created or destroyed (conservation of mass), so both sides must have equal atom counts — that's <b>balancing</b>, done by adjusting coefficients only (never subscripts — changing a subscript changes the substance!).</p>
<div class="ls-ex"><b>Worked example: burn methane.</b> CH<sub>4</sub> + O<sub>2</sub> → CO<sub>2</sub> + H<sub>2</sub>O.<br>
① Carbon: 1 = 1 ✓. ② Hydrogen: 4 left, 2 right → put 2H<sub>2</sub>O. ③ Oxygen: right side now 2+2 = 4 → put 2O<sub>2</sub>.<br>
Balanced: <b>CH<sub>4</sub> + 2O<sub>2</sub> → CO<sub>2</sub> + 2H<sub>2</sub>O</b>. Strategy: balance the element appearing in the fewest places first; leave lone elements (like O<sub>2</sub>) for last.</div>
<div class="ls-ex"><b>Practice on paper.</b> Balance: Al + O<sub>2</sub> → Al<sub>2</sub>O<sub>3</sub>. (Answer: 4Al + 3O<sub>2</sub> → 2Al<sub>2</sub>O<sub>3</sub> — fractions are allowed mid-work, then double everything.)</div>`},
{t:"0.5 The math toolkit — units, sig figs, dimensional analysis", h:`
<p>Three tools carry the entire course:</p>
<ul>
<li><b>Scientific notation:</b> 6.022×10<sup>23</sup> means 6.022 with the decimal moved 23 places right. Practice ×/÷ on your calculator's EE/EXP button until it's automatic.</li>
<li><b>Significant figures:</b> your answer can't be more precise than your worst measurement. Multiplying/dividing → keep as many sig figs as the least precise input (2.0 × 3.146 = 6.3, not 6.292). The AP graders accept ±1 sig fig, but wildly over-precise answers lose the point.</li>
<li><b>Dimensional analysis</b> — the superpower: write every number WITH its unit, multiply by conversion fractions, cancel units diagonally until only the target unit survives.</li></ul>
<div class="ls-ex"><b>Worked example.</b> How many seconds in 2.5 hours?<br>2.5 h × (60 min / 1 h) × (60 s / 1 min) = 9.0×10<sup>3</sup> s. Hours cancel, minutes cancel, seconds remain. Do EVERY chemistry calculation in this style — units that don't cancel are how you catch your own mistakes before the grader does.</div>`},
{t:"0.6 Ions — when atoms gain or lose electrons", h:`
<p>Atoms are electrically neutral (protons = electrons). But many atoms are more stable after gaining or losing electrons to reach a full outer shell — the result is an <b>ion</b>. Lose electrons → positive <b>cation</b> (metals do this: Na → Na<sup>+</sup>). Gain electrons → negative <b>anion</b> (nonmetals: Cl → Cl<sup>−</sup>).</p>
<p>The periodic table predicts the charges: Group 1 → +1, Group 2 → +2, Al → +3, Group 16 → −2, Group 17 → −1. Ionic compounds form in whatever ratio makes the total charge zero: Ca<sup>2+</sup> + Cl<sup>−</sup> → CaCl<sub>2</sub> (one 2+ needs two 1−).</p>
${DIAG2.bondTypes}
<div class="ls-ex"><b>Build-a-formula drill.</b> Aluminum oxide: Al<sup>3+</sup> and O<sup>2−</sup> → lowest common multiple of 3 and 2 is 6 → Al<sub>2</sub>O<sub>3</sub>. Ammonium sulfate: NH<sub>4</sub><sup>+</sup> and SO<sub>4</sub><sup>2−</sup> → (NH<sub>4</sub>)<sub>2</sub>SO<sub>4</sub>.</div>
<p><b>Start the Polyatomic Ions deck now</b> — those charged groups (nitrate, sulfate, ammonium…) act as single units and appear in every later unit.</p>`},
{t:"0.7 Solutions — what (aq) really means", h:`
<p>When salt disappears into water it hasn't ceased to exist — the crystal has been taken apart into individual ions, each escorted by a shell of water molecules. That's what the label <b>(aq)</b>, "aqueous", means: dissolved and surrounded by water.</p>
${DIAG2.dissolve}
<p>How much is dissolved is measured by <b>molarity</b>: M = moles of solute per liter of solution. A "1.0 M NaCl" bottle contains 1 mole (58.5 g) of NaCl in every liter. You'll meet the full machinery in Unit 3; for now the takeaway is: <b>(aq) = separated, hydrated ions</b> for ionic compounds, or intact hydrated molecules for things like sugar.</p>
<div class="ls-ex"><b>Sanity check.</b> Which conducts electricity: salt water or sugar water? Salt water — its dissolved ions are mobile charges. Sugar dissolves as whole neutral molecules → no conduction. This single idea (electrolyte vs non-electrolyte) returns in Unit 4.</div>`},
]};

// ---------------- BIG-PICTURE INTROS (X.0) ----------------
const INTROS = {
u1:{t:"1.0 The big picture — start here", h:`
<p><b>What this unit is about:</b> the atom itself — how we count atoms (the mole), how we know what's inside them (mass spectrometry, PES), how their electrons are arranged, and why position on the periodic table predicts behavior. One physical law explains almost everything here: <b>Coulomb's law</b> — opposite charges attract, more strongly when the charges are bigger and closer.</p>
<p><b>Words you'll need:</b> <i>mole</i> (a counting unit, 6.022×10<sup>23</sup> things), <i>molar mass</i> (grams per mole), <i>isotope</i> (same element, different neutron count), <i>electron configuration</i> (the seating plan of electrons), <i>valence electrons</i> (the outer ones that do chemistry), <i>ionization energy</i> (cost of removing an electron).</p>
${DIAG2.molemap}
<p><b>Why it matters later:</b> every unit that follows counts things in moles and explains behavior with electron arrangements. Master the mole roadmap above and half the course's arithmetic is done.</p>`},
u2:{t:"2.0 The big picture — start here", h:`
<p><b>What this unit is about:</b> how atoms stick together. Three glue types — ionic (transfer), covalent (sharing), metallic (electron sea) — then the skill of drawing molecules (Lewis structures) and predicting their 3-D shapes (VSEPR). Shape is destiny: a molecule's geometry decides whether it's polar, and polarity decides how it behaves in Unit 3.</p>
<p><b>Words you'll need:</b> <i>bond energy</i> (how much a bond costs to break), <i>lone pair</i> (electrons not shared), <i>electronegativity</i> (an atom's greed for shared electrons), <i>dipole</i> (a + and − end), <i>resonance</i> (one blended structure drawn several ways).</p>
<p><b>Study physically:</b> this is the unit for the model kit. Build every geometry with your hands once — it converts memorization into something obvious.</p>`},
u3:{t:"3.0 The big picture — start here", h:`
<p><b>What this unit is about:</b> the forces BETWEEN molecules (IMFs) and everything they explain: why some things boil at −160°C and others at +100°C, how gases behave (PV = nRT), what dissolving is, and how lab instruments (spectrophotometer, chromatography) exploit these forces. <b>This is the biggest unit on the exam (18–22%).</b></p>
<p><b>Words you'll need:</b> <i>intermolecular force / IMF</i> (attraction between separate molecules — much weaker than a bond), <i>vapor pressure</i> (a liquid's eagerness to evaporate), <i>polarizability</i> (how easily an electron cloud sloshes), <i>molarity</i> (mol per liter of solution).</p>
<p><b>The one sentence to carry:</b> bonds hold a molecule together; IMFs hold molecules NEAR each other — boiling breaks only the second kind.</p>`},
u4:{t:"4.0 The big picture — start here", h:`
<p><b>What this unit is about:</b> chemical change itself. Three reaction families you must recognize on sight — precipitation (ions pair off into a solid), acid–base (a proton hops), redox (electrons transfer) — plus the accounting skill of the whole course: stoichiometry (using the balanced equation as a recipe with mole ratios).</p>
<p><b>Words you'll need:</b> <i>net ionic equation</i> (the reaction with the bystanders deleted), <i>spectator ion</i> (present but unchanged), <i>limiting reactant</i> (the ingredient that runs out first), <i>oxidation number</i> (bookkeeping charge for tracking electrons), <i>titration</i> (measuring an unknown by reacting it exactly).</p>
<p><b>Prerequisite check:</b> the Polyatomic Ions and Solubility decks must be near-automatic before this unit — the reactions move fast if the vocabulary is fluent.</p>`},
u5:{t:"5.0 The big picture — start here", h:`
<p><b>What this unit is about:</b> speed. Not whether a reaction happens, but how FAST — and what controls the speed (concentration, temperature, catalysts). The evidence is experimental: rate laws come from data tables, never from the balanced equation. Then mechanisms: the actual step-by-step story of a reaction, where the slowest step sets the pace.</p>
<p><b>Words you'll need:</b> <i>rate</i> (concentration change per second), <i>rate constant k</i>, <i>order</i> (how sensitively rate responds to a concentration), <i>activation energy E<sub>a</sub></i> (the energy hill), <i>half-life</i> (time for half to react), <i>intermediate</i> (made then consumed), <i>catalyst</i> (lowers the hill, survives the reaction).</p>
<p><b>Keep separate in your head:</b> kinetics = how fast (this unit) vs thermodynamics = how far (Units 6–9). Confusing them is the classic exam error.</p>`},
u6:{t:"6.0 The big picture — start here", h:`
<p><b>What this unit is about:</b> energy accounting. Reactions release heat (exothermic) or absorb it (endothermic); we measure it with a thermometer and q = mcΔT, and we predict it with Hess's law, formation enthalpies, or bond energies. The bookkeeping sign convention (− = released) does more work in this unit than any concept.</p>
<p><b>Words you'll need:</b> <i>system vs surroundings</i> (the reaction vs everything else), <i>enthalpy ΔH</i> (heat at constant pressure), <i>specific heat c</i> (a substance's resistance to temperature change), <i>calorimeter</i> (a heat-measuring cup), <i>state function</i> (path doesn't matter).</p>
<p><b>The mental picture:</b> energy is released when strong bonds form. "Energy stored in bonds" is a lie your biology class told you — breaking bonds always COSTS energy.</p>`},
u7:{t:"7.0 The big picture — start here", h:`
<p><b>What this unit is about:</b> reactions that run both directions at once and settle into a balance — <b>equilibrium</b>. The constant K describes where the balance sits; the quotient Q says where you are right now; Le Châtelier predicts how the balance responds to stress. One diagram carries the whole unit:</p>
${DIAG2.qvsk}
<p><b>Words you'll need:</b> <i>dynamic equilibrium</i> (both reactions still running, rates equal), <i>ICE table</i> (Initial–Change–Equilibrium bookkeeping), <i>K<sub>sp</sub></i> (equilibrium constant for dissolving), <i>common-ion effect</i>.</p>
<p><b>Critical distinction:</b> K says how FAR a reaction goes, never how FAST. A huge K can belong to a reaction that takes a million years (that's Unit 5's business).</p>`},
u8:{t:"8.0 The big picture — start here", h:`
<p><b>What this unit is about:</b> equilibrium applied to the most important reaction type in biology and industry — proton transfer. The pH scale measures acidity; strong acids ionize completely while weak acids barely try (that's a Ka calculation); buffers resist pH change; titration curves tell a full story in one graph. Second-heaviest unit on the exam (11–15%).</p>
${DIAG2.phscale}
<p><b>Words you'll need:</b> <i>conjugate pair</i> (two species one H<sup>+</sup> apart), <i>K<sub>a</sub></i> (an acid's strength number), <i>buffer</i> (weak acid + its partner base), <i>equivalence point</i> (moles exactly matched), <i>half-equivalence</i> (where pH = pK<sub>a</sub>).</p>
<p><b>Prerequisite:</b> Unit 7's ICE-table machinery — Unit 8 is Unit 7 wearing an acid costume.</p>`},
u9:{t:"9.0 The big picture — start here", h:`
<p><b>What this unit is about:</b> the final verdict on any reaction — will it go? Entropy (S) measures dispersal, Gibbs free energy (ΔG = ΔH − TΔS) combines heat and dispersal into a single yes/no number, and electrochemistry cashes favorable reactions out as electricity (batteries) or forces unfavorable ones with electricity (electrolysis, charging).</p>
<p><b>Words you'll need:</b> <i>entropy S</i> (spread-out-ness of energy and matter), <i>thermodynamically favorable</i> (ΔG &lt; 0 — the exam's word for "spontaneous"), <i>anode/cathode</i> (where oxidation/reduction happen), <i>E°<sub>cell</sub></i> (a cell's voltage under standard conditions), <i>Faraday's constant</i> (charge of a mole of electrons).</p>
<p><b>The grand finale:</b> ΔG° = −RT ln K = −nFE° ties Units 6, 7 and 9 into one equation family — the hardest FRQs live exactly on that bridge.</p>`},
};

 {q:"Formal charge formula", a:"FC = valence e<sup>−</sup> − lone e<sup>−</sup> − ½(bonding e<sup>−</sup>)", note:"Best Lewis structure: FCs closest to zero, negative FC on the most electronegative atom."},
 {q:"What does resonance mean physically?", a:"The real structure is one average (delocalized e<sup>−</sup>); all equivalent bonds are equal length", note:"O3 bonds: both identical, between single and double. Never say 'it flips back and forth'."},
 {q:"Bond order vs bond length vs bond strength", a:"Higher order → shorter → stronger (C≡C &lt; C=C &lt; C–C in length)", note:"Also: shorter bond = deeper potential energy well on PE diagrams."},
]},
{ id:"imf", name:"Intermolecular Forces", desc:"Unit 3's core — the exam's biggest topic", cards:[
 {q:"The 4 IMFs, weakest → strongest (for comparable sizes)", a:"London dispersion &lt; dipole–dipole &lt; hydrogen bonding &lt; ion–dipole", note:"Ranking only works at similar molar mass — big LDF can beat small H-bonding."},
 {q:"Which molecules have London dispersion forces?", a:"ALL of them", note:"Saying 'nonpolar molecules have no IMFs' is an instant point loss."},
 {q:"What makes LDF stronger?", a:"More electrons / larger, more polarizable electron cloud (≈ higher molar mass); more surface contact", note:"Explains why I2 is solid, Br2 liquid, Cl2 gas."},
 {q:"Hydrogen bonding requires…", a:"H directly bonded to N, O, or F, attracted to a lone pair on N/O/F of another molecule", note:"CH4 has H and no H-bonding; HF, H2O, NH3, alcohols, amines do."},
 {q:"Why is H<sub>2</sub>O's boiling point so much higher than H<sub>2</sub>S's?", a:"H<sub>2</sub>O hydrogen-bonds; H<sub>2</sub>S only has dipole–dipole + LDF", note:"Textbook FRQ. Always name BOTH substances' forces in your justification."},
 {q:"Stronger IMFs mean… (boiling point, vapor pressure, viscosity)", a:"Higher bp, LOWER vapor pressure, higher viscosity &amp; surface tension", note:"Vapor pressure is the inverse one — the classic slip."},
 {q:"Ion–dipole forces matter when…", a:"An ionic compound dissolves in a polar solvent (Na<sup>+</sup> surrounded by water's O ends)", note:"This is the force that makes 'like dissolves like' work for salts."},
 {q:"\"Like dissolves like\" — the real rule", a:"Dissolution is favorable when solute–solvent attractions ≈ the attractions they replace", note:"Nonpolar solutes skip water because they'd break H-bonds without paying them back."},
 {q:"4 solid types & what holds them together", a:"Molecular (IMFs), ionic (ion–ion), covalent-network (covalent bonds), metallic (e<sup>−</sup> sea)", note:"Melting point order usually: network > ionic > metallic > molecular (with exceptions)."},
 {q:"Why does SiO<sub>2</sub> melt at ~1700°C but CO<sub>2</sub> sublimes at −78°C?", a:"SiO<sub>2</sub> is covalent-network (bonds must break); CO<sub>2</sub> is molecular (only LDF must break)", note:"Breaking bonds vs overcoming IMFs — the distinction the exam tests constantly."},
 {q:"Does boiling water break O–H bonds?", a:"NO — it overcomes hydrogen bonds BETWEEN molecules; covalent bonds stay intact", note:"Phase changes never break covalent bonds. Ever."},
 {q:"Real gases deviate from ideal when…", a:"High pressure (particle volume matters) and low temperature (IMFs matter)", note:"Ideal-gas assumptions: zero particle volume, zero IMFs — deviations attack exactly these two."},
]},
{ id:"lab", name:"Lab, Colors & Techniques", desc:"What you must recognize in lab-based questions", cards:[
 {q:"Flame test: Li<sup>+</sup>, Na<sup>+</sup>, K<sup>+</sup>", a:"Li = crimson red, Na = yellow-orange, K = lilac/violet", note:"Na contamination masks everything — that's why lab questions mention cobalt glass."},
 {q:"Flame test: Cu<sup>2+</sup>, Ba<sup>2+</sup>, Sr<sup>2+</sup>", a:"Cu = blue-green, Ba = pale green, Sr = red", note:""},
 {q:"Solution colors: Cu<sup>2+</sup>, Ni<sup>2+</sup>, Fe<sup>3+</sup>", a:"Cu<sup>2+</sup> blue, Ni<sup>2+</sup> green, Fe<sup>3+</sup> pale yellow/brown", note:"Transition-metal ions with partially filled d orbitals absorb visible light."},
 {q:"Solution colors: MnO<sub>4</sub><sup>−</sup>, CrO<sub>4</sub><sup>2−</sup>, Cr<sub>2</sub>O<sub>7</sub><sup>2−</sup>", a:"Permanganate deep purple, chromate yellow, dichromate orange", note:"MnO4⁻'s purple disappearing = endpoint of many redox titrations."},
 {q:"Classic precipitate colors: AgCl, PbI<sub>2</sub>, BaSO<sub>4</sub>, Cu(OH)<sub>2</sub>", a:"AgCl white, PbI<sub>2</sub> bright yellow, BaSO<sub>4</sub> white, Cu(OH)<sub>2</sub> pale blue", note:""},
 {q:"A solution is colored because it…", a:"ABSORBS the complementary color of the one you see", note:"Blue solution absorbs orange (~600 nm). Absorbed ≠ seen — classic trap."},
 {q:"Beer–Lambert law & what it's for", a:"A = εbc — absorbance is proportional to concentration", note:"Calibration curve: measure A of standards, fit line, read unknown's c."},
 {q:"Which wavelength do you choose for spectrophotometry?", a:"The wavelength of MAXIMUM absorbance of the analyte", note:"Maximizes sensitivity of the calibration curve."},
 {q:"Equivalence point vs endpoint (titration)", a:"Equivalence = moles match stoichiometrically; endpoint = indicator changes color", note:"You pick an indicator whose color change is near the equivalence pH."},
 {q:"Paper chromatography: what does a high R<sub>f</sub> mean?", a:"Component is more attracted to the mobile phase (solvent) than the stationary paper", note:"Rf = distance component / distance solvent front. Justify in terms of IMFs."},
 {q:"Filtration vs distillation — separation is based on…", a:"Filtration: solid vs liquid (solubility). Distillation: boiling-point differences (IMF strength)", note:""},
 {q:"Calorimetry sign logic", a:"q<sub>reaction</sub> = −q<sub>solution</sub>; water heats up ⇒ reaction is exothermic", note:"q = mcΔT uses the SOLUTION's mass and c, not the solute's."},
 {q:"Percent yield", a:"(actual ÷ theoretical) × 100", note:"Theoretical comes from the LIMITING reactant — find it first."},
 {q:"Common error question: why is measured molarity too low after rinsing buret with water?", a:"Water dilutes titrant → more volume used → calculated analyte concentration too high (or reverse, reason it)", note:"Error-analysis FRQs: trace the error through the actual formula, term by term."},
]},
{ id:"eq", name:"Equations — Which Tool When", desc:"The formula sheet is GIVEN. Know when to grab what.", cards:[
 {q:"You need moles of a gas from P, V, T", a:"PV = nRT (R = 0.08206 L·atm/mol·K)", note:"Watch units: Kelvin always; pressure must match R's units."},
 {q:"Heat absorbed by a solution warming up", a:"q = mcΔT", note:"m = mass of the solution/water, c = 4.18 J/g·K unless told otherwise."},
 {q:"ΔH of a reaction from two or three given reactions", a:"Hess's law: flip (sign flips) and scale (multiply ΔH) then add", note:"Also: ΔH° = Σ ΔHf°(products) − Σ ΔHf°(reactants)."},
 {q:"ΔH estimate from bond energies", a:"ΔH ≈ Σ bonds broken − Σ bonds formed", note:"Broken minus formed — breaking costs energy, forming releases it."},
 {q:"Is a reaction spontaneous (thermodynamically favorable)?", a:"ΔG = ΔH − TΔS; ΔG &lt; 0 ⇒ favorable", note:"−ΔH,+ΔS: always. +ΔH,−ΔS: never. Mixed signs: depends on T."},
 {q:"Link between ΔG° and the equilibrium constant", a:"ΔG° = −RT ln K; ΔG° &lt; 0 ⟺ K &gt; 1", note:"R = 8.314 J/mol·K here. Also E°: ΔG° = −nFE°."},
 {q:"Rate law from experimental data", a:"Compare trials where one concentration changes: rate ratio = (conc ratio)<sup>order</sup>", note:"Rate laws come from DATA or the slow step — never from overall coefficients."},
 {q:"Which plot is linear for order 0 / 1 / 2?", a:"[A] vs t / ln[A] vs t / 1/[A] vs t", note:"Slopes: −k, −k, +k. The exam loves giving you three plots and asking which is straight."},
 {q:"Half-life you should know by heart", a:"First order: t<sub>½</sub> = 0.693/k — independent of concentration", note:"Constant half-life ⟺ first order. Two half-lives ⇒ 25% left."},
 {q:"Buffer pH in one line", a:"Henderson–Hasselbalch: pH = pK<sub>a</sub> + log([A<sup>−</sup>]/[HA])", note:"Equal concentrations ⇒ pH = pKa. Best buffer range: pKa ± 1."},
 {q:"Relationships between Kw, Ka, Kb, pH, pOH (25°C)", a:"K<sub>w</sub> = K<sub>a</sub>·K<sub>b</sub> = 10<sup>−14</sup>; pH + pOH = 14", note:"Conjugate pairs only for Ka·Kb = Kw."},
 {q:"Which direction will a reaction shift? (given concentrations)", a:"Compute Q, compare to K: Q &lt; K → forward; Q &gt; K → reverse", note:"Q has the same form as K but with current (not equilibrium) values."},
 {q:"Cell potential from half-reactions", a:"E°<sub>cell</sub> = E°<sub>cathode</sub> − E°<sub>anode</sub> (reduction potentials, don't scale them)", note:"E° is intensive: multiplying a half-reaction does NOT multiply E°."},
 {q:"Electrolysis: how much metal is deposited?", a:"I·t = charge (C); ÷ 96485 → mol e<sup>−</sup>; use half-reaction ratio", note:"Faraday's constant is on the sheet. Track mol electrons like any stoichiometry."},
]},
{ id:"trends", name:"Periodic Trends & Atomic Structure", desc:"Justify everything with Coulomb's law", cards:[
 {q:"Atomic radius trend + one-line reason", a:"↓ across a period (higher Z<sub>eff</sub>, same shell); ↑ down a group (more shells)", note:"Every trend answer should mention nuclear charge and/or shell distance."},
 {q:"First ionization energy trend", a:"↑ across, ↓ down — stronger pull on a closer electron costs more to remove", note:""},
 {q:"The two classic IE exceptions in period 2", a:"Be &gt; B (2p starts, higher energy) and N &gt; O (paired e<sup>−</sup> repulsion in O's 2p)", note:"Exam asks these as 'which is unexpected and why'."},
 {q:"Electronegativity trend & the champion", a:"↑ across, ↓ down; F is the most electronegative", note:"Drives bond polarity: ΔEN large → polar covalent → ionic."},
 {q:"Cation vs parent atom size; anion vs parent", a:"Cation smaller (lost outer e<sup>−</sup>, higher Z<sub>eff</sub> per e<sup>−</sup>); anion larger (more repulsion)", note:""},
 {q:"Ranking isoelectronic species by radius", a:"Same e<sup>−</sup> count ⇒ more protons = smaller (O<sup>2−</sup> &gt; F<sup>−</sup> &gt; Na<sup>+</sup> &gt; Mg<sup>2+</sup>)", note:""},
 {q:"Successive ionization energies: what does a huge jump mean?", a:"You broke into the core (noble-gas) shell — jump after n removals ⇒ Group n", note:"IE1≈500, IE2≈4600 kJ/mol ⇒ Group 1."},
 {q:"PES spectrum: what do peak position and height mean?", a:"Position = binding energy (closer to nucleus = higher); height = number of electrons in that subshell", note:"1s peaks sit at highest energy; heights read like an electron configuration."},
 {q:"Coulomb's law as the master explanation", a:"Attraction ∝ q<sub>1</sub>q<sub>2</sub>/r<sup>2</sup> — bigger charges, shorter distance ⇒ stronger", note:"Works for IE, radius, lattice energy, bond strength… memorize the sentence pattern."},
 {q:"Electron configuration exceptions to know", a:"Cr = [Ar]4s<sup>1</sup>3d<sup>5</sup>, Cu = [Ar]4s<sup>1</sup>3d<sup>10</sup>", note:"Half-filled/filled d subshell stability."},
 {q:"Which electrons leave first when a transition metal ionizes?", a:"The 4s electrons (before 3d)", note:"Fe²⁺ = [Ar]3d⁶, not [Ar]4s²3d⁴."},
 {q:"Average atomic mass from a mass spectrum", a:"Σ (isotope mass × fractional abundance)", note:"Peaks at 24 (0.79), 25 (0.10), 26 (0.11) ⇒ ≈24.3 ⇒ magnesium."},
]},
];

// ================= APP =================
const EXAM_DATE = new Date(2027, 4, 6); // May 6, 2027
const INT = [0, 1, 3, 7, 16, 30];       // days per Leitner box 0..5

let state = { version: 1, cards: {}, quizHistory: [], activity: {}, lessons: {}, qstats: {}, frq: {}, checks: {} };

// ---------- persistence (auto-save) ----------
// Uses the browser's local storage when available (opening the same file/URL in the
// same browser resumes automatically). Falls back to in-memory + export/import
// in sandboxed environments where storage is blocked.
const STORE_KEY = "apchem-trainer-v1";
let storageOK = false;
try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); storageOK = true; } catch (e) { storageOK = false; }
function normalizeState(d) {
  return { version: 1, cards: d.cards || {}, quizHistory: d.quizHistory || [], activity: d.activity || {}, lessons: d.lessons || {}, qstats: d.qstats || {}, frq: d.frq || {}, checks: d.checks || {} };
}
function save() {
  if (!storageOK) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}
function loadSaved() {
  if (!storageOK) return;
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY));
    if (d && typeof d === "object" && d.cards) state = normalizeState(d);
  } catch (e) {}
}

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function todayYmd() { return ymd(new Date()); }
function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function logActivity(n) { const t = todayYmd(); state.activity[t] = (state.activity[t] || 0) + n; save(); }
function cardKey(deckId, idx) { return deckId + "_" + idx; }
function cardState(deckId, idx) { return state.cards[cardKey(deckId, idx)] || { box: 0, due: todayYmd() }; }
function isDue(cs) { return cs.due <= todayYmd(); }
function deckDue(deck) { let n = 0; deck.cards.forEach((c, i) => { if (isDue(cardState(deck.id, i))) n++; }); return n; }
function deckMastery(deck) { let s = 0; deck.cards.forEach((c, i) => s += cardState(deck.id, i).box); return s / (deck.cards.length * 5); }
function totalDue() { return DECKS.reduce((s, d) => s + deckDue(d), 0); }
function streak() {
  let n = 0; const d = new Date();
  if (!state.activity[ymd(d)]) d.setDate(d.getDate() - 1); // today not yet studied → count from yesterday
  while (state.activity[ymd(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function chargeVariants(s) {
  // "SO42-" ⇄ "SO4-2", "NH4+1" ⇄ "NH41+" etc. — accept the charge written either way around
  const out = [];
  let m = s.match(/^(.+?)(\d)([+-])$/); // ...digit sign  (SO4"2-")
  if (m) out.push(m[1] + m[3] + m[2]);
  m = s.match(/^(.+?)([+-])(\d)$/);     // ...sign digit  (SO4"-2")
  if (m) out.push(m[1] + m[3] + m[2]);
  return out;
}
function normAns(s) {
  const supers = { "⁰": "0", "¹": "1", "²": "2", "³": "3", "⁴": "4", "⁺": "+", "⁻": "-" };
  const subs = { "₀": "0", "₁": "1", "₂": "2", "₃": "3", "₄": "4", "₅": "5", "₆": "6", "₇": "7", "₈": "8", "₉": "9" };
  return (s || "").split("").map(ch => supers[ch] || subs[ch] || ch).join("")
    .replace(/[−–]/g, "-").replace(/[\s^()]/g, "").toUpperCase();
}

document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {

function tile(label, value, hint) {
  const t = el("div", "tile");
  t.append(el("div", "label", label), el("div", "value", String(value)), el("div", "hint", hint));
  return t;
}

// ---------- mastery (Khan-style levels) ----------
function unitChecks(l) {
  const un = l.id.slice(1);
  const keys = Object.keys(CHECKS).filter(k => k.split(".")[0] === un);
  const ok = keys.filter(k => state.checks[k] && state.checks[k].ok).length;
  return { ok, total: keys.length };
}
function unitMastery(l) {
  // weighted average over the components this unit actually has
  const parts = [[10, state.lessons[l.id] ? 1 : 0]];
  const c = unitChecks(l);
  if (c.total) parts.push([25, c.ok / c.total]);
  if (l.decks && l.decks.length) {
    parts.push([20, l.decks.reduce((s, did) => s + deckMastery(DECKS.find(d => d.id === did)), 0) / l.decks.length]);
  }
  if (l.quiz) parts.push([30, (bestScore(l.quiz) || 0) / 100]);
  if (l.frq) { const fr = state.frq[l.id]; parts.push([15, fr ? fr.got / fr.max : 0]); }
  const wsum = parts.reduce((s, p) => s + p[0], 0);
  return Math.round(100 * parts.reduce((s, p) => s + p[0] * p[1], 0) / wsum);
}
function levelOf(p) {
  if (p <= 0) return { n: "Not started", c: "var(--baseline)" };
  if (p < 50) return { n: "Attempted", c: "var(--ink-3)" };
  if (p < 75) return { n: "Familiar", c: "var(--s2)" };
  if (p < 92) return { n: "Proficient", c: "var(--s1)" };
  return { n: "Mastered", c: "var(--good)" };
}

// ---------- section checks ("Check your understanding") ----------
function checkWidget(key, c) {
  const box = el("div", "chk");
  const done = state.checks[key] && state.checks[key].ok;
  box.append(el("div", "chk-title", "✔ Check your understanding" + (done ? " · answered ✓" : "")));
  box.append(el("div", "chk-q", c.q));
  const order = shuffle(c.o.map((_, i) => i));
  const btns = [];
  order.forEach(oi => {
    const b = el("button", "qz-opt", c.o[oi]);
    b.style.fontSize = "13.5px"; b.style.padding = "9px 13px";
    b.addEventListener("click", () => {
      const cur = state.checks[key] || { ok: 0, w: 0 };
      if (oi === c.ans) {
        btns.forEach(x => x.disabled = true);
        b.classList.add("correct");
        box.append(el("div", "qz-expl", c.ex));
        cur.ok = 1; state.checks[key] = cur; logActivity(1);
      } else {
        b.classList.add("wrong"); b.disabled = true;
        cur.w = (cur.w || 0) + 1; state.checks[key] = cur; save();
      }
    });
    btns.push(b); box.append(b);
  });
  return box;

function renderDecks() {

function startSession(deck) {
  let queue = [];
  (deck ? [deck] : DECKS).forEach(d => d.cards.forEach((c, i) => {
    if (isDue(cardState(d.id, i))) queue.push({ deck: d, card: c, idx: i });
  }));
  if (!queue.length && deck) deck.cards.forEach((c, i) => queue.push({ deck, card: c, idx: i })); // review-anyway mode
  queue = shuffle(queue).slice(0, 25);
  session = { queue, pos: 0, done: 0, again: 0, reviewAnyway: !deck ? false : deckDue(deck) === 0 };
  renderDecks();
}
function renderSession(p) {
  const s = session;
  if (s.pos >= s.queue.length) {
    const d = el("div", "fc-done");
    d.append(el("div", "big", "Session complete ✔"),
      el("div", null, s.done + " cards reviewed · " + s.again + " marked \"again\" (they'll come back tomorrow)"),
      el("div", "hint", ""));
    const b = el("button", "btn", "Back to decks"); b.style.marginTop = "16px";
    b.addEventListener("click", () => { session = null; renderDecks(); });
    d.append(b); p.append(d); return;
  }
  const item = s.queue[s.pos], c = item.card;
  const stage = el("div", "fc-stage");
  stage.append(el("div", "fc-top",
    "<span>" + item.deck.name + "</span><span>" + (s.pos + 1) + " / " + s.queue.length + "</span>"));
  const card = el("div", "fc-card");
  card.append(el("div", "q", c.q));
  const ansWrap = el("div", null, "");
  const actions = el("div", "fc-actions");

  function reveal(verdict) {
    ansWrap.innerHTML = "";
    if (verdict) ansWrap.append(el("div", "typed-verdict " + (verdict === "ok" ? "ok" : "no"), verdict === "ok" ? "Correct ✔" : "Not quite —"));
    ansWrap.append(el("div", "a", c.a));
    if (c.note) ansWrap.append(el("div", "note", c.note));
    actions.innerHTML = "";
    [["again", "Again", 0], ["good", "Good", 1], ["easy", "Easy", 2]].forEach(([cls, lbl, step]) => {
      const b = el("button", "btn " + cls, lbl);
      b.addEventListener("click", () => grade(step));
      actions.append(b);
    });
    if (verdict === "ok") actions.children[1].focus();
  }
  function grade(step) {
    const key = cardKey(item.deck.id, item.idx);
    const cs = cardState(item.deck.id, item.idx);
    const r = (cs.r || 0), w = (cs.w || 0);
    if (step === 0) {
      state.cards[key] = { box: 0, due: addDays(1), r, w: w + 1 };
      s.again++;
      s.queue.splice(Math.min(s.pos + 4, s.queue.length), 0, item); // re-ask 3 cards later
    } else {
      const box = Math.min(5, (cs.box || 0) + step);
      state.cards[key] = { box, due: addDays(INT[box]), r: r + 1, w };
    }
    logActivity(1); s.done++; s.pos++;
    $("#panel-cards").innerHTML = ""; renderSession($("#panel-cards"));
  }

  if (c.typed) {
    const inp = el("input"); inp.placeholder = "e.g. SO42-"; inp.autocapitalize = "off";
    const hint = el("div", "note", "Type it flat — no superscripts needed. All of these count: <b>SO42-</b>, <b>SO4^2-</b>, <b>SO4 2-</b>, <b>so4-2</b>");
    hint.style.fontSize = "12px";
    const check = el("button", "btn", "Check");
    const doCheck = () => {
      const v = normAns(inp.value);
      const ok = v.length > 0 && c.accept.some(a => {
        const na = normAns(a);
        return na === v || chargeVariants(na).includes(v) || chargeVariants(v).includes(na);
      });
      inp.disabled = true; check.remove(); reveal(ok ? "ok" : "no");
    };
    check.addEventListener("click", doCheck);
    inp.addEventListener("keydown", e => { if (e.key === "Enter" && !inp.disabled) { e.preventDefault(); doCheck(); } });
    card.append(inp, hint, check, ansWrap);
    setTimeout(() => inp.focus(), 0);
  } else {
    const show = el("button", "btn ghost", "Show answer");
    show.addEventListener("click", () => { show.remove(); reveal(null); });
    card.append(show, ansWrap);
  }
  stage.append(card, actions);
  const quit = el("button", "btn ghost small", "End session"); quit.style.marginTop = "18px";
  quit.addEventListener("click", () => { session = null; renderDecks(); });
  const qwrap = el("div", null, ""); qwrap.style.textAlign = "center"; qwrap.append(quit);
  stage.append(qwrap);
  p.append(stage);
}

let quiz = null;
function bestScore(uid) {
  const h = state.quizHistory.filter(x => x.unit === uid);
  return h.length ? Math.max(...h.map(x => Math.round(100 * x.score / x.total))) : null;
}

function startQuiz(u) {
  launchQuiz(u, u.qs.map((q, qi) => ({ q, uid: u.id, qi })));
}
function launchQuiz(u, items) {
  const qs = shuffle(items).map(it => ({ q: it.q, uid: it.uid, qi: it.qi, order: shuffle(it.q.o.map((_, i) => i)) }));
  quiz = { u, qs, pos: 0, correct: 0, misses: [] };
  renderQuizList();
}
function weakPool() {
  const pool = [];
  QUIZZES.forEach(u => u.qs.forEach((q, qi) => {
    const st = state.qstats[u.id + "#" + qi];
    if (st && st.w > 0 && st.w >= st.r) pool.push({ q, uid: u.id, qi, wscore: st.w * 2 - st.r, uname: u.name });
  }));
  return pool.sort((a, b) => b.wscore - a.wscore);
}
function startReviewQuiz() {
  launchQuiz({ id: "review", name: "Smart Review · your missed questions", weight: "" }, weakPool().slice(0, 12));
}
function startChallenge() {
  const seen = new Set();
  let items = [];
  QUIZZES.forEach(u => {
    shuffle(u.qs.map((q, qi) => ({ q, uid: u.id, qi }))).slice(0, 3)
      .forEach(it => { seen.add(it.uid + "#" + it.qi); items.push(it); });
  });
  const extras = shuffle(QUIZZES.flatMap(u => u.qs.map((q, qi) => ({ q, uid: u.id, qi }))))
    .filter(it => !seen.has(it.uid + "#" + it.qi)).slice(0, 3);
  items = shuffle(items.concat(extras)).slice(0, 30);
  launchQuiz({ id: "challenge", name: "Course Challenge · all units mixed", weight: "" }, items);
}
function renderQuiz(p) {
  const z = quiz;
  if (z.pos >= z.qs.length) {
    state.quizHistory.push({ unit: z.u.id, name: z.u.name, score: z.correct, total: z.qs.length, ts: todayYmd() });

      el("div", "verdict", (pct >= 80 ? "≥ 80% — unit cleared. Re-do the misses below once, then move on." : "Below 80% — review the misses, retake in 3 days.")
        + (z.misses.length ? " Missed questions joined your 🧠 Smart Review pool." : "")));
    const back = el("button", "btn", "Back to quizzes");
    back.addEventListener("click", () => { quiz = null; renderQuizList(); });
    r.append(back);
    p.append(r);
    if (z.misses.length) {
      p.append(el("h2", null, "Review your misses"));
      const t = el("table", "reviewtbl", "<tr><th>Question</th><th>Correct answer</th><th>Why</th></tr>");
      z.misses.forEach(m => {
        const tr = el("tr", null, "<td>" + m.q.q + "</td><td>" + m.q.o[m.q.ans] + "</td><td>" + m.q.ex + "</td>");
        t.append(tr);
      });
      p.append(t);
    }
    return;
  }
  const item = z.qs[z.pos], q = item.q;
  const stage = el("div", "qz-stage");
  const prog = el("div", "qz-progress"); prog.append(el("div"));
  prog.firstChild.style.width = (100 * z.pos / z.qs.length) + "%";
  stage.append(el("div", "fc-top", "<span>" + z.u.name + "</span><span>" + (z.pos + 1) + " / " + z.qs.length + "</span>"), prog);
  stage.append(el("div", "qz-q", q.q));
  const optBtns = [];
  item.order.forEach(oi => {
    const b = el("button", "qz-opt", q.o[oi]);
    b.addEventListener("click", () => {
      optBtns.forEach(x => x.disabled = true);
      const right = oi === q.ans;

      right ? st.r++ : st.w++;
      save();
      b.classList.add(right ? "correct" : "wrong");
      if (!right) { optBtns[item.order.indexOf(q.ans)].classList.add("correct"); z.misses.push({ q }); }
      else z.correct++;
      stage.append(el("div", "qz-expl", "<b>" + (right ? "Correct." : "Answer: " + q.o[q.ans]) + "</b> " + q.ex));
      const next = el("button", "btn", z.pos + 1 >= z.qs.length ? "Finish" : "Next");
      next.addEventListener("click", () => { z.pos++; p.innerHTML = ""; renderQuiz(p); });
      stage.append(next); next.focus();
    });
    optBtns.push(b); stage.append(b);
  });
  const quit = el("button", "btn ghost small", "Abandon quiz"); quit.style.marginTop = "18px";
  quit.addEventListener("click", () => { quiz = null; renderQuizList(); });
  stage.append(el("div")); stage.lastChild.style.textAlign = "center"; stage.lastChild.append(quit);

function buildParentReport() {

  const days = Math.max(0, Math.ceil((EXAM_DATE - new Date()) / 86400000));
  const last7 = (() => { let n = 0; for (let i = 0; i < 7; i++) { const d = new Date(); d.setDate(d.getDate() - i); n += state.activity[ymd(d)] || 0; } return n; })();
  const lines = [
    "📊 AP CHEMISTRY — PROGRESS REPORT (" + todayYmd() + ")",
    "Exam in " + days + " days · Course mastery: " + avg + "% · Streak: " + streak() + " day(s) · Answers this week: " + last7,

  ];
  LESSONS.forEach(l => {
    const m = unitMastery(l), lv = levelOf(m);
    const best = bestScore(l.quiz);
    const fr = state.frq[l.id];
    lines.push("U" + l.id.slice(1) + " " + l.name.split("·")[1].trim() + ": " + lv.n + " " + m + "%"

    const done = () => alert("Report copied ✔ — paste it into WhatsApp/iMessage and send it.");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
    } else fallbackCopy(txt, done);
  });
  rcHead.append(shareBtn);
  rc.append(rcHead, el("div", "chart-sub", "One row per unit, built from every flashcard and quiz answer. The 'next move' column is the study plan. The copy button creates a text summary to send to your parents — a weekly habit."));
  const rt = el("table", "reviewtbl", "<tr><th>Unit</th><th>Level</th><th>Lesson</th><th>Quiz best</th><th>FRQ</th><th>Weak Qs</th><th>Grade</th><th>Next move</th></tr>");
  LESSONS.forEach(l => {
    const studied = !!state.lessons[l.id];
    const best = bestScore(l.quiz);
    const weakN = pool.filter(x => x.uid === l.quiz).length;
    const mastery = l.decks.reduce((s, did) => s + deckMastery(DECKS.find(d => d.id === did)), 0) / l.decks.length;
    const g = gradeOf(best);
    const gCol = g === "A" || g === "B" ? "var(--good-text)" : g === "C" ? "var(--s2)" : g === "D" ? "var(--crit)" : "var(--ink-3)";
    const fr = state.frq[l.id];
    const uc = unitChecks(l);
    const move = !studied ? "Read the lesson (Learn tab)"
      : !l.quiz ? (uc.ok < uc.total ? "Answer the remaining section checks" : "Foundations complete ✓")
      : best == null ? "Take the unit quiz"
      : best < 80 ? "Review your misses, retake in ~3 days"
      : weakN ? "Clear " + weakN + " question(s) via Smart Review"
      : !fr ? "Do the unit's FRQ practice (Learn tab, bottom)"
      : fr.got < fr.max * 0.7 ? "FRQ below 70% — reread the sections behind the missed points, retry"
      : mastery < 0.6 ? "Keep drilling deck: " + l.decks.map(did => DECKS.find(d => d.id === did).name).join(", ")
      : "Solid — maintain with daily due cards";
    const um = unitMastery(l), ulv = levelOf(um);
    rt.append(el("tr", null,
      "<td>" + l.name.replace(" ·", "<br><span style='font-size:11px;color:var(--ink-3)'>") + "</span></td>"
      + "<td><b style='color:" + ulv.c + "'>" + ulv.n + "</b><br><span style='font-size:11px;color:var(--ink-3)'>" + um + "%</span></td>"
      + "<td>" + (studied ? "✓" : "—") + "</td>"
      + "<td>" + (best == null ? "—" : best + "%") + "</td>"
      + "<td>" + (fr ? fr.got + "/" + fr.max : "—") + "</td>"
      + "<td>" + (weakN || "—") + "</td>"
      + "<td><b style='color:" + gCol + "'>" + (g || "—") + "</b></td>"
      + "<td style='font-size:12.5px'>" + move + "</td>"));
  });
  rc.append(rt);
  p.append(rc);

  // ---- Weak spots ----
  const weakCards = Object.entries(state.cards)
    .map(([k, cs]) => ({ k, cs, sc: (cs.w || 0) * 2 - (cs.r || 0) }))
    .filter(x => (x.cs.w || 0) > 0 && x.sc > 0)
    .sort((a, b) => b.sc - a.sc).slice(0, 6);
  if (weakCards.length || pool.length) {
    const ws = el("div", "chart-tile"); ws.style.marginBottom = "14px";
    ws.append(el("h3", null, "🎯 Current weak spots"), el("div", "chart-sub", "Most-missed items right now — these are tomorrow's easiest points to win."));
    const wt = el("table", "reviewtbl", "<tr><th>Type</th><th>Item</th><th>Misses</th></tr>");
    weakCards.forEach(x => {
      const [did, idx] = [x.k.slice(0, x.k.lastIndexOf("_")), +x.k.slice(x.k.lastIndexOf("_") + 1)];
      const deck = DECKS.find(d => d.id === did);
      if (!deck || !deck.cards[idx]) return;
      wt.append(el("tr", null, "<td>Card · " + deck.name + "</td><td>" + deck.cards[idx].q + "</td><td>" + (x.cs.w || 0) + "×</td>"));
    });
    pool.slice(0, 5).forEach(x => {
      wt.append(el("tr", null, "<td>Quiz · " + x.uname.split("·")[0].trim() + "</td><td>" + x.q.q + "</td><td>" + state.qstats[x.uid + "#" + x.qi].w + "×</td>"));
    });
    ws.append(wt);
    p.append(ws);
  }

  const wrap = el("div", "grid cols-2");

  // Deck mastery — horizontal bars (single series)
  const c1 = el("div", "chart-tile");
  c1.append(el("h3", null, "Deck mastery"), el("div", "chart-sub", "Average spaced-repetition level per deck (100% = every card at max interval)"));
  DECKS.forEach(d => {
    const m = Math.round(deckMastery(d) * 100);
    const row = el("div", "hbar-row");
    row.append(el("div", "hbar-label", d.name));
    const track = el("div", "hbar-track");
    const fill = el("div", "hbar-fill"); fill.style.width = m + "%";
    fill.addEventListener("mousemove", e => showTip(e, d.name + ": " + m + "% · " + deckDue(d) + " due"));
    fill.addEventListener("mouseleave", hideTip);
    track.append(fill); row.append(track, el("div", "hbar-val", m + "%"));
    c1.append(row);
  });
  wrap.append(c1);

  // Activity — last 14 days, vertical bars (SVG)
  const c2 = el("div", "chart-tile");
  c2.append(el("h3", null, "Daily activity"), el("div", "chart-sub", "Cards + quiz questions answered, last 14 days"));
  c2.append(activityChart());
  wrap.append(c2);
  p.append(wrap);

  // Quiz history — line
  const c3 = el("div", "chart-tile"); c3.style.marginTop = "14px";
  c3.append(el("h3", null, "Quiz scores over time"), el("div", "chart-sub", "Each point is one quiz attempt · dashed line = the 80% bar"));
  c3.append(quizChart());
  p.append(c3);

  // Table view (accessibility / detail)
  const c4 = el("div", "chart-tile"); c4.style.marginTop = "14px";
  c4.append(el("h3", null, "Quiz attempts — table"));
  if (!state.quizHistory.length) c4.append(el("div", "chart-sub", "No attempts yet."));
  else {
    const t = el("table", "reviewtbl", "<tr><th>Date</th><th>Unit</th><th>Score</th></tr>");
    state.quizHistory.slice().reverse().forEach(h =>
      t.append(el("tr", null, "<td>" + h.ts + "</td><td>" + h.name + "</td><td>" + h.score + "/" + h.total + " (" + Math.round(100 * h.score / h.total) + "%)</td>")));
    c4.append(t);
  }
  p.append(c4);
}
function svgEl(w, h) { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 " + w + " " + h); s.style.width = "100%"; return s; }
function sAttr(e, o) { for (const k in o) e.setAttribute(k, o[k]); return e; }
function svgNode(n, o) { return sAttr(document.createElementNS("http://www.w3.org/2000/svg", n), o); }
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function activityChart() {
  const W = 420, H = 150, padL = 30, padB = 22, padT = 10;
  const svg = svgEl(W, H);
  const days = []; for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push({ key: ymd(d), lbl: (d.getMonth() + 1) + "/" + d.getDate(), v: state.activity[ymd(d)] || 0 }); }
  const max = Math.max(10, ...days.map(d => d.v));
  const bw = (W - padL - 8) / 14;
  // hairline gridlines
  [0.5, 1].forEach(f => {
    const y = H - padB - f * (H - padB - padT);
    svg.append(svgNode("line", { x1: padL, x2: W - 4, y1: y, y2: y, stroke: css("--grid"), "stroke-width": 1 }));
    const lbl = svgNode("text", { x: padL - 4, y: y + 4, "text-anchor": "end", "font-size": 10, fill: css("--ink-3") });
    lbl.textContent = Math.round(f * max); svg.append(lbl);
  });
  svg.append(svgNode("line", { x1: padL, x2: W - 4, y1: H - padB, y2: H - padB, stroke: css("--baseline"), "stroke-width": 1 }));
  days.forEach((d, i) => {
    const h = d.v / max * (H - padB - padT);
    const x = padL + i * bw + 2, y = H - padB - h;
    const r = svgNode("rect", { x, y, width: bw - 4, height: Math.max(h, d.v ? 2 : 0), fill: css("--s1"), rx: 3 });
    r.addEventListener("mousemove", e => showTip(e, d.lbl + ": " + d.v + " answered"));
    r.addEventListener("mouseleave", hideTip);
    svg.append(r);
    if (i % 2 === 1) {
      const t = svgNode("text", { x: padL + i * bw + bw / 2, y: H - 7, "text-anchor": "middle", "font-size": 9, fill: css("--ink-3") });
      t.textContent = d.lbl; svg.append(t);
    }
  });
  return svg;
}
function quizChart() {
  const W = 860, H = 190, padL = 36, padB = 24, padT = 12, padR = 14;
  const svg = svgEl(W, H);
  const hist = state.quizHistory;
  const iw = W - padL - padR, ih = H - padB - padT;
  const y = pct => padT + (1 - pct / 100) * ih;
  [0, 50, 100].forEach(v => {
    svg.append(svgNode("line", { x1: padL, x2: W - padR, y1: y(v), y2: y(v), stroke: css("--grid"), "stroke-width": 1 }));
    const t = svgNode("text", { x: padL - 5, y: y(v) + 4, "text-anchor": "end", "font-size": 10, fill: css("--ink-3") });
    t.textContent = v + "%"; svg.append(t);
  });
  svg.append(svgNode("line", { x1: padL, x2: W - padR, y1: y(80), y2: y(80), stroke: css("--ink-3"), "stroke-width": 1, "stroke-dasharray": "4 4" }));
  if (!hist.length) {
    const t = svgNode("text", { x: W / 2, y: H / 2, "text-anchor": "middle", "font-size": 13, fill: css("--ink-3") });
    t.textContent = "Take your first quiz to start this chart"; svg.append(t);
    return svg;
  }
  const xs = i => hist.length === 1 ? padL + iw / 2 : padL + i / (hist.length - 1) * iw;
  let dstr = "";
  hist.forEach((h, i) => { const pct = 100 * h.score / h.total; dstr += (i ? "L" : "M") + xs(i) + " " + y(pct) + " "; });
  svg.append(svgNode("path", { d: dstr, fill: "none", stroke: css("--s1"), "stroke-width": 2, "stroke-linejoin": "round" }));
  hist.forEach((h, i) => {
    const pct = Math.round(100 * h.score / h.total);
    const c = svgNode("circle", { cx: xs(i), cy: y(pct), r: 4.5, fill: css("--s1"), stroke: css("--surface-1"), "stroke-width": 2 });
    c.addEventListener("mousemove", e => showTip(e, h.name + "<br>" + h.ts + " · " + h.score + "/" + h.total + " (" + pct + "%)"));
    c.addEventListener("mouseleave", hideTip);
    svg.append(c);
    if (i === hist.length - 1) {
      const t = svgNode("text", { x: xs(i), y: pct > 90 ? y(pct) + 20 : y(pct) - 9, "text-anchor": "middle", "font-size": 11, "font-weight": 700, fill: css("--ink-1") });
      t.textContent = pct + "%"; svg.append(t);
    }
  });
  return svg;
}

// ---------- data (export / import) ----------
function renderData() {
  const p = $("#panel-data"); p.innerHTML = "";
  if (storageOK) {
    const n = el("div", "notice");
    n.style.background = "color-mix(in srgb, var(--good) 12%, var(--surface-1))";
    n.style.borderColor = "color-mix(in srgb, var(--good) 40%, var(--surface-1))";
    n.innerHTML = "<b>✓ Auto-save is ON.</b> Progress is saved in this browser automatically after every answer — just open this same file/link next time and continue. This tab is only for: <b>backup</b> (export a copy now and then), <b>moving to another device</b> (export here, import there), and reset. To show your progress to your parents, use <b>📤 Copy report</b> on the Progress tab instead — no file needed.";
    p.append(n);
  } else {
    p.append(el("div", "notice", "<b>Auto-save isn't available in this viewer.</b> Progress lives only in this open tab: click <b>Export</b> before closing, and <b>Import</b> the file next session. (Tip: download the file and open it directly in Chrome/Safari — auto-save turns on there.)"));
  }
  const g = el("div", "grid cols-2");
  const t1 = el("div", "tile");
  t1.append(el("h2", null, "Export progress"), el("div", "hint", "Downloads ap-chem-progress.json with your card schedule, quiz history and streak."));
  const eb = el("button", "btn", "Export progress file"); eb.style.marginTop = "12px";
  eb.addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ap-chem-progress-" + todayYmd() + ".json";
    a.click(); URL.revokeObjectURL(a.href);
  });
  t1.append(eb);
  const t2 = el("div", "tile");
  t2.append(el("h2", null, "Import progress"), el("div", "hint", "Load the file you exported last time. Replaces the current session's data."));
  const fi = document.createElement("input"); fi.type = "file"; fi.accept = ".json"; fi.style.marginTop = "12px";
  fi.addEventListener("change", () => {
    const f = fi.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || typeof d !== "object" || !d.cards) throw 0;
        state = normalizeState(d);
        save();
        alert("Progress imported ✔");
        render(activeTab());
      } catch (e) { alert("That file doesn't look like an AP Chem Trainer export."); }
    };
    r.readAsText(f);
  });
  t2.append(fi);
  g.append(t1, t2); p.append(g);
  const stats = el("div", "tile"); stats.style.marginTop = "14px";
  const nCards = DECKS.reduce((s, d) => s + d.cards.length, 0);
  const nQs = QUIZZES.reduce((s, u) => s + u.qs.length, 0);
  // PIN management (optional lock)
  if (storageOK) {
    const pinTile = el("div", "tile"); pinTile.style.marginTop = "14px";
    const hasPin = (() => { try { return !!localStorage.getItem("apchem-pin"); } catch (e) { return false; } })();
    pinTile.append(el("h2", null, "PIN lock (optional)"),
      el("div", "hint", hasPin
        ? "A PIN is set — the app asks for it on every open. Forgetting it means resetting the app, so only keep it if you need it."
        : "Off by default for simplicity. Turn it on only if others use this computer and you want to keep them out. Note: forgetting the PIN erases your progress."));
    if (hasPin) {
      const rm = el("button", "btn small ghost", "Remove PIN"); rm.style.marginTop = "10px";
      rm.addEventListener("click", () => {
        const v = prompt("Enter your current PIN to remove it:");
        if (v == null) return;
        try {
          if (pinHash(v.trim()) === localStorage.getItem("apchem-pin")) {
            localStorage.removeItem("apchem-pin"); alert("PIN removed — the app now opens directly."); renderData();
          } else alert("Wrong PIN.");
        } catch (e) {}
      });
      pinTile.append(rm);
    } else {
      const pi = document.createElement("input"); pi.type = "password"; pi.placeholder = "New PIN (4+ characters)"; pi.style.marginTop = "10px"; pi.style.marginRight = "8px";
      pi.style.padding = "8px 10px"; pi.style.border = "1px solid var(--baseline)"; pi.style.borderRadius = "8px"; pi.style.background = "var(--page)"; pi.style.color = "var(--ink-1)";
      const en = el("button", "btn small", "Enable PIN");
      en.addEventListener("click", () => {
        const v = pi.value.trim();
        if (v.length < 4) { alert("PIN must be at least 4 characters."); return; }
        try { localStorage.setItem("apchem-pin", pinHash(v)); } catch (e) {}
        alert("PIN enabled — you'll be asked for it next time the app opens.");
        renderData();
      });
      pinTile.append(pi, en);
    }
    p.append(pinTile);
  }
  const danger = el("div", "tile"); danger.style.marginTop = "14px";
  danger.append(el("h2", null, "Reset"), el("div", "hint", "Wipes all saved progress in this browser (cards, quizzes, lessons). Cannot be undone — export a backup first."));
  const rb = el("button", "btn small", "Reset all progress"); rb.style.marginTop = "10px"; rb.style.background = "var(--crit)";
  rb.addEventListener("click", () => {
    if (!confirm("Delete ALL progress? This cannot be undone.")) return;
    state = normalizeState({ cards: {} });
    if (storageOK) { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }
    render(activeTab());
  });
  danger.append(rb);
  p.append(danger);
  const nSecs = LESSONS.reduce((s, l) => s + l.sections.length, 0);
  stats.innerHTML = "<div class='label'>Content in this build</div><div class='hint' style='margin-top:6px'>" + LESSONS.length + " unit lessons (" + nSecs + " sections) · " + DECKS.length + " decks · " + nCards + " flashcards · " + QUIZZES.length + " unit quizzes · " + nQs + " questions. Spaced-repetition intervals: 1 → 3 → 7 → 16 → 30 days.</div>";
  p.append(stats);
}

// ---------- PIN lock ----------
function pinHash(str) { // cyrb53 — deterrent lock, not cryptographic security
  let h1 = 0xdeadbeef ^ 7, h2 = 0x41c6ce57 ^ 7;
  for (let i = 0, ch; i < str.length; i++) {
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return String(4294967296 * (2097151 & h2) + (h1 >>> 0));
}
function pinGate() {
  if (!storageOK) return; // sandboxed preview: nothing persists, nothing to protect
  let unlocked = false;
  try { unlocked = sessionStorage.getItem("apchem-unlock") === "1"; } catch (e) {}
  if (unlocked) return;
  const saved = (() => { try { return localStorage.getItem("apchem-pin"); } catch (e) { return null; } })();
  if (!saved) return; // PIN is optional — no lock unless one was set (Save / Load tab)
  const lock = $("#lock"), inp = $("#lock input"), btn = $("#lock button"),
        msg = $("#lock .lk-msg"), title = $("#lock .lk-title"), forgot = $("#lock .lk-forgot");
  lock.style.display = "flex";
  function done() {
    try { sessionStorage.setItem("apchem-unlock", "1"); } catch (e) {}
    lock.style.display = "none";
  }
  function submit() {
    const v = inp.value.trim();
    msg.classList.remove("err");
    if (pinHash(v) === saved) {
      done();
    } else {
      msg.textContent = "Wrong PIN — try again."; msg.classList.add("err");
      inp.value = ""; inp.focus();
    }
  }
  btn.addEventListener("click", submit);
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); submit(); } });
  forgot.addEventListener("click", e => {
    e.preventDefault();
    if (!confirm("Reset the app? This erases the PIN AND all saved progress. Cannot be undone.")) return;
    try { localStorage.removeItem("apchem-pin"); localStorage.removeItem(STORE_KEY); } catch (er) {}
    location.reload();
  });
  setTimeout(() => inp.focus(), 50);
}

// ---------- boot ----------
loadSaved();
pinGate();
if (storageOK) {
  const f = document.querySelector(".footer-note");
  if (f) f.textContent = "Built for Kıvanç · Active recall + spaced repetition · Auto-save on: progress is stored in this browser.";
}
renderDash();
</script>
